<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" fill="none">
  <rect width="1200" height="1400" fill="#111827"/>
  <rect y="735" width="1200" height="665" fill="#F4F0E8"/>
  <text x="76" y="74" fill="#C6AD83" font-family="Arial,sans-serif" font-size="10" letter-spacing="3">THE HAMJA EXPERIENCE · JH MONOGRAM</text>
  <text x="76" y="118" fill="#F4F0E8" font-family="Georgia,serif" font-size="31">A personal signature in JH.</text>
  <text x="76" y="167" fill="#8793A3" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">MIDNIGHT APPLICATION</text>
  <text x="93" y="238" fill="#8793A3" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">01 · PRIMARY EMBLEM</text>
  <image href="jh-emblem.svg" x="92" y="260" width="255" height="255"/>
  <text x="436" y="238" fill="#8793A3" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">02 · FULL BRAND LOCKUP</text>
  <image href="jh-lockup-dark.svg" x="404" y="257" width="360" height="203"/>
  <text x="875" y="238" fill="#8793A3" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">03 · FAVICON</text>
  <rect x="887" y="272" width="112" height="112" rx="10" fill="#1B2638" stroke="#3A4657"/>
  <image href="jh-icon.svg" x="911" y="296" width="64" height="64"/>
  <text x="873" y="412" fill="#F4F0E8" font-family="Georgia,serif" font-size="16">One glyph. Two initials.</text>
  <text x="76" y="566" fill="#8793A3" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">PALETTE · RESTRAINED CHAMPAGNE ON MIDNIGHT</text>
  <g font-family="Arial,sans-serif" font-size="8" letter-spacing="1.2">
    <rect x="77" y="590" width="172" height="48" fill="#111827" stroke="#3A4657"/><text x="88" y="658" fill="#F4F0E8">MIDNIGHT NAVY</text>
    <rect x="265" y="590" width="172" height="48" fill="#1B2638" stroke="#3A4657"/><text x="276" y="658" fill="#F4F0E8">CHARCOAL BLUE</text>
    <rect x="453" y="590" width="172" height="48" fill="#C6AD83"/><text x="464" y="658" fill="#C6AD83">MUTED CHAMPAGNE</text>
    <rect x="641" y="590" width="172" height="48" fill="#789A98"/><text x="652" y="658" fill="#789A98">DESATURATED TEAL</text>
    <rect x="829" y="590" width="172" height="48" fill="#F4F0E8"/><text x="840" y="658" fill="#F4F0E8">WARM IVORY</text>
  </g>
  <text x="76" y="702" fill="#F4F0E8" font-family="Georgia,serif" font-size="13" font-style="italic">THE J BECOMES THE LEFT STEM OF THE H.</text>
  <text x="76" y="802" fill="#657283" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">LIGHT APPLICATION · THE SAME EMBLEM, REBALANCED FOR IVORY</text>
  <image href="jh-emblem-ivory.svg" x="92" y="850" width="255" height="255"/>
  <image href="jh-lockup-ivory.svg" x="404" y="828" width="360" height="203"/>
  <rect x="887" y="872" width="112" height="112" rx="10" fill="#E9E2D6" stroke="#D1C7B7"/>
  <image href="jh-icon-ivory.svg" x="911" y="896" width="64" height="64"/>
  <text x="77" y="1180" fill="#111827" font-family="Georgia,serif" font-size="26" font-style="italic">A seal for the work, and the person behind it.</text>
  <path d="M77 1210h1046" stroke="#C6AD83" stroke-opacity=".6"/>
  <text x="77" y="1252" fill="#657283" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">SHARED VERTICAL · J HOOK · ONE DISTINCTIVE MONOGRAM</text>
</svg>
